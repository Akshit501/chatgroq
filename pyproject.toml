[project]
name = "gen"
version = "0.1.0"
description = "LangChain translator with Groq"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.5",
    "langchain>=1.5.0",
    "langchain-groq>=1.1.3",
    "pypdf>=7.0.1",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.33",
    "streamlit>=1.67.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
gen = "gen:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
